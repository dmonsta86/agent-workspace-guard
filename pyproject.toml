[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace-guard"
version = "0.2.3"
description = "Reference implementation of a transactional workspace and commit broker for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dmonsta86" }]
keywords = ["coding-agent", "sandbox", "filesystem", "safety", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/dmonsta86/agent-workspace-guard"
Documentation = "https://github.com/dmonsta86/agent-workspace-guard/blob/main/docs/ONE_PAGE.md"
Issues = "https://github.com/dmonsta86/agent-workspace-guard/issues"

[project.scripts]
awg = "agent_workspace_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
