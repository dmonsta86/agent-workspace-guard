name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source manifest
        run: python scripts/verify_manifest.py

      - name: Install build tooling and package
        run: |
          python -m pip install --upgrade pip "setuptools>=68" wheel
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run destructive-action replays
        run: python scripts/run_replay.py

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Check installed CLI
        run: awg --help
